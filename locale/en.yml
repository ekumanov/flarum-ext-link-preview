ekumanov-link-preview:
  admin:
    description: Renders OpenGraph preview cards for links in Flarum 2.0 posts. Includes a server-side fetcher with SSRF-hardened HTTP, per-post rate limits, and admin-controlled host whitelist/blacklist.
    settings:
      ttl_seconds: Cache TTL (seconds)
      ttl_seconds_help: How long a fetched preview stays cached before it can be re-fetched. Default 2592000 (30 days). Lower values mean fresher previews but more outbound fetches.
      user_rate_per_hour: New URLs per user per hour
      user_rate_per_hour_help: Cap on how many new URL fetches one user can trigger per rolling hour. Existing cached cards aren't affected. Default 20.
      max_urls_per_post: Max URLs per post
      max_urls_per_post_help: How many URLs the scanner extracts from a single post body. Cards beyond this aren't generated. Default 10.
      whitelist: Hostname whitelist
      whitelist_help: One host per line. When set, ONLY listed hosts get cards. Subdomain wildcards like *.example.com supported; www. prefix normalized.
      show_favicons: Show site icons on cards
      show_favicons_help: >
        Render the linked page's own favicon as a small mark next to the site
        name on preview cards and hover previews. Icons are hot-linked from the
        source, exactly like card thumbnails, and sent with no referrer. Off
        means no icon URL is put in the page at all.
      icon_probe: Probe for /favicon.ico
      icon_probe_help: >
        When a fetched page declares no icon of its own, ask its server once for
        the conventional /favicon.ico. This is a server-side request to the same
        host the page came from — no third-party favicon service is used, so
        readers' browsers never contact anyone new. Tried once per link, never
        repeated on later fetches.
      favicon_max_bytes: Max icon size (bytes)
      favicon_max_bytes_help: >
        A probed icon larger than this is discarded. Multi-resolution .ico files
        are routinely tens of kilobytes for an 18-pixel slot. Default 204800
        (200 KB). Only applies to probed icons; an icon the page declares itself
        is hot-linked whatever its size.
      user_agents: Fetcher identities
      user_agents_help: >
        One User-Agent per line, most preferred first. The first is used for every
        fetch; the rest are only tried when a site answers with a block (401, 403,
        406, 429). Leave empty for the built-in chain: desktop Chrome, then the two
        social-scraper identities, which many sites allowlist specifically so link
        previews work. Put a single line here if you would rather the fetcher only
        ever present as itself.
      blacklist: Hostname blacklist
      blacklist_help: One host per line. Listed hosts never get cards. Subdomain wildcards like *.example.com supported; www. prefix normalized. Applied after whitelist.
  forum:
    hide_preview: Hide preview
    pin_preview: Pin preview
    preview_aria_prefix: Link preview
